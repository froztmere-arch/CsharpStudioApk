
name: Build APK from uploaded zip

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack the uploaded zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip')

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Keep exactly one project ZIP in the repository root."
            exit 1
          fi

          mkdir -p /tmp/src
          unzip -q "${ZIPS[0]}" -d /tmp/src

          CFG=$(find /tmp/src -type f \
            -name capacitor.config.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$CFG" ]; then
            echo "::error::capacitor.config.json not found inside ZIP."
            exit 1
          fi

          echo "PROJ=$(dirname "$CFG")" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish compiler (Blazor WASM + Roslyn)
        working-directory: ${{ env.PROJ }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Compiler/CSharpStudio.csproj ]; then
            echo "::error::Compiler/CSharpStudio.csproj was not found."
            exit 1
          fi

          dotnet publish Compiler/CSharpStudio.csproj \
            -c Release \
            -o publish

      - name: Verify output has what the app needs
        working-directory: ${{ env.PROJ }}
        shell: bash
        run: |
          set -euo pipefail

          F="publish/wwwroot/_framework"

          if [ ! -d "$F" ]; then
            echo "::error::Framework directory not found: $F"
            exit 1
          fi

          echo "Published framework files:"
          find "$F" -maxdepth 1 -type f -printf '%f\n' | sort

          require_file() {
            local pattern="$1"

            if ! compgen -G "$F/$pattern" > /dev/null; then
              echo "::error::Required file missing: $pattern"
              exit 1
            fi

            echo "OK: $pattern"
          }

          require_file 'blazor.boot.json'
          require_file 'System.Private.CoreLib*.dll'
          require_file 'System.Console*.dll'
          require_file 'Microsoft.CodeAnalysis.CSharp*.dll'
          require_file 'Microsoft.CSharp*.dll'

          if [ ! -f publish/wwwroot/index.html ]; then
            echo "::error::Published index.html is missing."
            exit 1
          fi

          # Remove compressed copies that may conflict with
          # the original files in the Android asset merger.
          find publish/wwwroot -type f \
            \( -name '*.gz' -o -name '*.br' \) -delete

          rm -rf www
          cp -r publish/wwwroot www

          echo "Web application output verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        working-directory: ${{ env.PROJ }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "::error::package.json was not found."
            exit 1
          fi

          npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        working-directory: ${{ env.PROJ }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          M="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$M" ]; then
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          fi

          if ! grep -q 'largeHeap' "$M"; then
            sed -i \
              's/<application/<application android:largeHeap="true"/' \
              "$M"
          fi

          if ! grep -q 'windowSoftInputMode' "$M"; then
            sed -i \
              's/<activity/<activity android:windowSoftInputMode="adjustResize"/' \
              "$M"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        shell: bash
        run: |
          set -euo pipefail

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJ }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: csharp-studio-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        working-directory: ${{ env.PROJ }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "C# Studio APK #${{ github.run_number }}" \
            --notes "Debug APK built from the uploaded project ZIP."
